name: .NET Desktop Build & Publish

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    env:
      Solution_Path: DynamicIsland.sln
      Project_Path: DynamicIsland/DynamicIsland.csproj

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Path }}

    - name: Build solution (${{ matrix.configuration }})
      run: dotnet build ${{ env.Solution_Path }} --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish Single-File Executable (Release only)
      if: matrix.configuration == 'Release'
      run: dotnet publish ${{ env.Project_Path }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

    - name: Upload Executable Artifact (Release only)
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: DynamicIsland-win-x64
        path: ./publish/DynamicIsland.exe
